services:
  - type: web
    name: monopoly
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && cd backend && npm install --include=dev && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
